<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Review Appeals • Bloxion</title><link rel="stylesheet" href="bloxion.css" /></head>
<body>
  <div id="loading" class="loading">Loading appeal queue…</div>
  <div id="app" class="app-shell hidden">
    <aside class="sidebar"><div class="brand"><span class="brand-mark">B</span><span>Bloxion<small>Employee Portal</small></span></div><nav><a class="nav-link" href="dashboard.html">Dashboard</a><a class="nav-link" href="employee-management.html">Employee Directory</a><a class="nav-link active" href="review-appeals.html">Review Appeals</a></nav></aside>
    <main class="main"><header class="topbar"><div><h1>Discipline Appeals</h1><p>Review pending employee appeals.</p></div><button id="logoutBtn" class="btn ghost">Log Out</button></header>
      <div class="content"><div id="message" class="message"></div><div class="page-heading"><div><div class="eyebrow">Discipline management</div><h2>Pending appeals</h2><p>Managers see their department; administrators can review across Bloxion.</p></div></div><section class="card"><div id="appealList" class="list"></div><div id="empty" class="empty">No pending appeals were found.</div></section></div>
    </main>
  </div>
<script type="module">
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, doc, getDoc, getDocs, query, serverTimestamp, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db, loadOwnProfile, canReviewAppeals, canCrossDepartments, makeElement, showMessage } from "./bloxion-core.js";
const loading=document.getElementById("loading"),app=document.getElementById("app"),list=document.getElementById("appealList"),empty=document.getElementById("empty"),message=document.getElementById("message");let profile=null;
function labeled(label,value){const box=makeElement("div",{className:"detail-box"});box.append(makeElement("div",{className:"detail-label",text:label}),makeElement("div",{className:"detail-value",text:value||"—"}));return box;}
function renderAppeal(id,data){empty.classList.add("hidden");const item=makeElement("div",{className:"list-item"});const top=makeElement("div",{className:"list-top"});top.append(makeElement("div",{className:"list-title",text:data.employeeUsername||"Employee"}),makeElement("span",{className:"pill warning",text:data.status||"pending"}));item.append(top);const details=makeElement("div",{className:"detail-grid"});details.append(labeled("Employee ID",data.employeeId),labeled("Department",data.departmentName),labeled("Discipline ID",data.writeUpId),labeled("Email",data.employeeEmail),labeled("Appeal reason",data.appealReason));item.append(details);
const decisionWrap=makeElement("div",{className:"form-grid"});decisionWrap.style.marginTop="14px";const dField=makeElement("div",{className:"field"});dField.append(makeElement("label",{text:"Decision"}));const select=makeElement("select");["","upheld","reduced","overturned","denied"].forEach(v=>{const o=makeElement("option",{text:v?v[0].toUpperCase()+v.slice(1):"Select decision"});o.value=v;select.append(o);});dField.append(select);const rField=makeElement("div",{className:"field"});rField.append(makeElement("label",{text:"Decision reason"}));const notes=makeElement("textarea");notes.placeholder="Explain the decision.";rField.append(notes);decisionWrap.append(dField,rField);item.append(decisionWrap);const save=makeElement("button",{className:"btn primary",text:"Save Decision",type:"button"});save.addEventListener("click",()=>saveDecision(id,data,select.value,notes.value,save));item.append(save);list.append(item);}
async function load(){list.replaceChildren();empty.classList.remove("hidden");let q=canCrossDepartments(profile)?query(collection(db,"appeals"),where("status","==","pending")):query(collection(db,"appeals"),where("departmentId","==",profile.departmentId),where("status","==","pending"));const snap=await getDocs(q);snap.forEach(s=>renderAppeal(s.id,s.data()));}
async function saveDecision(id,data,decision,reason,button){decision=String(decision||"").trim().toLowerCase();reason=String(reason||"").trim();if(!decision||!reason)return showMessage(message,"Select a decision and provide a reason.","error");button.disabled=true;try{await updateDoc(doc(db,"appeals",id),{status:"reviewed",decision,decisionReason:reason,reviewedBy:auth.currentUser.uid,reviewedByUsername:profile.username||"",reviewedAt:serverTimestamp()});if(data.writeUpId){const ref=doc(db,"writeUps",data.writeUpId),snap=await getDoc(ref);if(snap.exists()){const updates={underAppeal:false,updatedAt:serverTimestamp()};updates.status=decision==="overturned"?"overturned":decision==="reduced"?"reduced":"active";await updateDoc(ref,updates);}}showMessage(message,"Appeal decision saved.","success");await load();}catch(e){console.error(e);showMessage(message,e.message||"Decision could not be saved.","error");}finally{button.disabled=false;}}
onAuthStateChanged(auth,async user=>{if(!user)return location.href="login.html";profile=await loadOwnProfile(user);if(!profile||!canReviewAppeals(profile))return location.href="dashboard.html";loading.classList.add("hidden");app.classList.remove("hidden");try{await load();}catch(e){showMessage(message,"Appeals could not be loaded. Check Firestore rules/indexes.","error");}});
document.getElementById("logoutBtn").addEventListener("click",async()=>{await signOut(auth);location.href="login.html";});
</script></body></html>
