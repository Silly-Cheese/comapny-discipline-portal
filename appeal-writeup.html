<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Discipline Record • Bloxion</title><link rel="stylesheet" href="bloxion.css" /></head>
<body>
<div id="loading" class="loading">Loading discipline record…</div>
<div id="app" class="app-shell hidden">
<aside class="sidebar"><div class="brand"><span class="brand-mark">B</span><span>Bloxion<small>Employee Portal</small></span></div><nav><a class="nav-link" href="dashboard.html">Dashboard</a><button class="nav-link active" type="button">Discipline Record</button></nav></aside>
<main class="main"><header class="topbar"><div><h1>Discipline Record</h1><p>Review your record and submit an appeal when eligible.</p></div><button id="logoutBtn" class="btn ghost">Log Out</button></header>
<div class="content"><div id="message" class="message"></div><section class="grid"><article class="card span-7"><h3>Record details</h3><p class="card-subtitle">This information is issued by Bloxion management.</p><div id="details" class="detail-grid"></div></article><article class="card span-5"><h3>Appeal</h3><p class="card-subtitle">Only active records that are not already under appeal can be appealed.</p><form id="appealForm"><div class="field"><label for="appealReason">Appeal reason</label><textarea id="appealReason" required maxlength="3000" placeholder="Explain why you are appealing this discipline record."></textarea></div><button id="submitBtn" class="btn primary" type="submit">Submit Appeal</button></form></article></section></div>
</main></div>
<script type="module">
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { addDoc, collection, doc, getDoc, getDocs, query, serverTimestamp, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { auth, db, loadOwnProfile, makeElement, normalizeRole, showMessage, statusClass } from "./bloxion-core.js";
const id=new URLSearchParams(location.search).get("id")||"",loading=document.getElementById("loading"),app=document.getElementById("app"),details=document.getElementById("details"),message=document.getElementById("message"),form=document.getElementById("appealForm"),submitBtn=document.getElementById("submitBtn");let profile=null,record=null;
function detail(label,value,cls){const b=makeElement("div",{className:"detail-box"});b.append(makeElement("div",{className:"detail-label",text:label}));const v=makeElement("div",{className:cls||"detail-value",text:value||"—"});b.append(v);return b;}
async function loadRecord(){if(!id)throw new Error("No discipline record ID was provided.");const snap=await getDoc(doc(db,"writeUps",id));if(!snap.exists())throw new Error("That discipline record could not be found.");record=snap.data();if(String(record.employeeId)!==String(profile.employeeId))throw new Error("You do not have permission to view this record.");details.replaceChildren();details.append(detail("Category",record.category),detail("Severity",record.severity),detail("Status",record.status||"active",statusClass(record.status||"active")),detail("Issued by",record.issuedByUsername||record.issuedBy),detail("Department",record.departmentName),detail("Under appeal",record.underAppeal===true?"Yes":"No"),detail("Reason",record.reason),detail("Manager notes",record.managerNotes),detail("Evidence / references",record.evidenceLinks));const eligible=normalizeRole(record.status||"active")==="active"&&record.underAppeal!==true;submitBtn.disabled=!eligible;if(!eligible)showMessage(message,"This record is not currently eligible for a new appeal.","info");}
form.addEventListener("submit",async e=>{e.preventDefault();const reason=document.getElementById("appealReason").value.trim();if(!reason)return showMessage(message,"Enter your appeal reason.","error");if(!record||normalizeRole(record.status||"active")!=="active"||record.underAppeal===true)return showMessage(message,"This record is not eligible for appeal.","error");submitBtn.disabled=true;try{const existing=await getDocs(query(collection(db,"appeals"),where("writeUpId","==",id),where("employeeId","==",profile.employeeId),where("status","==","pending")));if(!existing.empty)throw new Error("A pending appeal already exists for this record.");await addDoc(collection(db,"appeals"),{writeUpId:id,employeeId:profile.employeeId,employeeUsername:profile.username||"",employeeEmail:profile.email||"",departmentId:record.departmentId||profile.departmentId||"",departmentName:record.departmentName||profile.departmentName||"",status:"pending",appealReason:reason,reviewedBy:null,reviewedAt:null,decision:null,decisionReason:null,submittedAt:serverTimestamp()});await updateDoc(doc(db,"writeUps",id),{underAppeal:true,updatedAt:serverTimestamp()});showMessage(message,"Your appeal was submitted.","success");form.reset();record.underAppeal=true;await loadRecord();}catch(err){console.error(err);showMessage(message,err.message||"Appeal could not be submitted.","error");}finally{submitBtn.disabled=false;}});
onAuthStateChanged(auth,async user=>{if(!user)return location.href="login.html";try{profile=await loadOwnProfile(user);if(!profile)return location.href="login.html";await loadRecord();loading.classList.add("hidden");app.classList.remove("hidden");}catch(e){loading.textContent=e.message||"Discipline record could not be loaded.";}});
document.getElementById("logoutBtn").addEventListener("click",async()=>{await signOut(auth);location.href="login.html";});
</script></body></html>
